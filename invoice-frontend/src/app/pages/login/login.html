<div class="login-container">
  <div class="login-box">
    <div class="logo-container">
      <img src="/assets/logo.png" class="logo" alt="Logo" />
    </div>

    <h3>NomadStudio</h3>

    <!-- Login View -->
    <div *ngIf="mode === 'login'">
      <div class="input-group">
        <input
          type="text"
          placeholder="Username"
          [(ngModel)]="userName"
          [class.error]="showError && !userName"
          autocomplete="username"
        />
      </div>
      <div class="input-group">
        <input
          type="password"
          placeholder="Password"
          [(ngModel)]="password"
          [class.error]="showError && !password"
          autocomplete="current-password"
        />
      </div>

      <div class="error-message" *ngIf="showError">
        Username and password are required
      </div>

      <button (click)="login()">Login</button>

      <div class="link-group">
        <a (click)="changeMode('forgot')">Forgot Password?</a>
      </div>
    </div>

    <!-- Forgot Password View -->
    <div *ngIf="mode === 'forgot'">
      <div class="input-group">
        <input type="email" placeholder="Email Address" [(ngModel)]="emailId" />
      </div>

      <button (click)="forgotPassword()" [disabled]="submitting">
        {{ submitting ? 'Sending...' : 'Send OTP' }}
      </button>

      <div class="link-group">
        <a (click)="changeMode('login')">Back to Login</a>
      </div>
    </div>

    <!-- OTP Verification View -->
    <div *ngIf="mode === 'otp'">
      <p class="flow-message">Enter the 6-digit OTP sent to {{ emailId }}.</p>
      <div class="input-group">
        <input type="text" placeholder="Enter OTP" [(ngModel)]="otp" inputmode="numeric"
          autocomplete="one-time-code" maxlength="6" />
      </div>

      <button (click)="verifyOtp()" [disabled]="submitting">
        {{ submitting ? 'Verifying...' : 'Verify OTP' }}
      </button>

      <div class="link-group flow-links">
        <a (click)="forgotPassword()">Resend OTP</a>
        <a (click)="changeMode('forgot')">Change Email</a>
        <a (click)="changeMode('login')">Back to Login</a>
      </div>
    </div>

    <!-- New Password View (shown only after OTP verification) -->
    <div *ngIf="mode === 'reset'">
      <div class="input-group">
        <input type="password" placeholder="New Password" [(ngModel)]="newPassword"
          autocomplete="new-password" minlength="8" />
      </div>
      <div class="input-group">
        <input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword"
          autocomplete="new-password" minlength="8" />
      </div>

      <button (click)="resetPassword()" [disabled]="submitting">
        {{ submitting ? 'Updating...' : 'Reset Password' }}
      </button>

      <div class="link-group">
        <a (click)="changeMode('login')">Back to Login</a>
      </div>
    </div>
  </div>
</div>
